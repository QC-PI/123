<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title></title>

  <style>

    body{

  font-family:Arial;

  background:
  linear-gradient(
    rgba(255,255,255,0.2),
    rgba(255,255,255,0.2)
  ),

  url('background.jpg');

  background-size:cover;

  background-position:center;

  background-repeat:no-repeat;

  background-attachment:fixed;

  min-height:100vh;

  padding:20px;

}

    input{
      width:100%;
      padding:12px;
      margin-bottom:20px;
      border-radius:10px;
      border:1px solid #ccc;
      box-sizing:border-box;
    }

    .grid{
      display:grid;
      grid-template-columns:
      repeat(auto-fit,minmax(300px,1fr));
      gap:20px;
    }

    .card{

  background:
  rgba(255,255,255,0.88);

  backdrop-filter:blur(5px);

  padding:15px;

  border-radius:15px;

  box-shadow:
  0 4px 15px rgba(0,0,0,0.2);

}

    .card h3{
      margin-top:0;
    }

    iframe{
      width:100%;
      height:250px;
      border:none;
      border-radius:10px;
      margin-top:10px;
    }

    .btn{
      display:block;
      margin-top:10px;
      padding:10px;
      text-align:center;
      background:#007bff;
      color:white;
      text-decoration:none;
      border-radius:10px;
    }

    .menu-grid{

  display:grid;

  grid-template-columns:
  repeat(2,1fr);

  gap:20px;

  width:100%;

  max-width:700px;

  position:absolute;

  top:50%;

  left:50%;

  transform:
  translate(-50%,-50%);

}

@media(max-width:768px){

  .menu-grid{

    grid-template-columns:
    repeat(2,1fr);

    gap:12px;

  }

  .menu-btn{

    height:90px;

    font-size:15px;

  }

}


    h1{

  text-align:center;

  color:#000;

  font-size:42px;

  margin-bottom:40px;

  text-shadow:
  1px 1px 3px rgba(255,255,255,0.5);

}
    .menu-btn{

  width:100%;

  height:110px;

  border:none;

  border-radius:20px;

  background:
  rgba(0,123,255,0.85);

  color:white;

  font-size:18px;

  font-weight:bold;

  cursor:pointer;

  transition:0.3s;

  backdrop-filter:blur(5px);

  box-shadow:
  0 5px 15px rgba(0,0,0,0.2);

}

    .menu-btn:hover{

  transform:scale(1.03);

  background:
  rgba(0,123,255,1);

}

    .back-btn{
      margin-bottom:20px;
      padding:10px 20px;
      border:none;
      border-radius:10px;
      background:#333;
      color:white;
      cursor:pointer;
    }



  </style>

</head>

<body>

<h1></h1>

<!-- HALAMAN MENU -->
<div id="homePage">

  <div class="menu-grid"
       id="menuGrid">

  </div>

</div>

<!-- HALAMAN FILE -->
<div id="filePage"
     style="display:none;">

  <button
    onclick="goBack()"
    class="back-btn">

    ← Back

  </button>

  <input
    type="text"
    id="search"
    placeholder="Search material..."
  >

  <div class="grid"
       id="container">

  </div>

</div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbxX3zxW78ZtIwoKMv99G632bSmb4BYYz1ZVIt9HaVMy6hj8N7HscfytEWj_TT7JV_OT/exec";

let database = [];

let currentCategory = "";

fetch(API_URL)
  .then(res => res.json())
  .then(data => {

    database = data;

    loadCategories();

  });

function loadCategories(){

  const menuGrid =
    document.getElementById("menuGrid");

  const categories =
    [...new Set(
      database.map(
        item => item.Category
      )
    )];

  menuGrid.innerHTML = "";

  categories.forEach(category => {

    menuGrid.innerHTML += `

      <button
        class="menu-btn"
        onclick="openCategory('${category}')">

        ${category}

      </button>

    `;

  });

}

function openCategory(category){

  currentCategory = category;

  document
    .getElementById("homePage")
    .style.display = "none";

  document
    .getElementById("filePage")
    .style.display = "block";

  const filtered =
    database.filter(item =>

      item.Category === category

    );

  displayData(filtered);

}

function displayData(data){

  const container =
    document.getElementById("container");

  container.innerHTML = "";

  if(data.length === 0){

    container.innerHTML =
      "<p>Tidak ada file ditemukan.</p>";

    return;
  }

  data.forEach(item => {

    container.innerHTML += `

      <div class="card">

        <h3>${item.Material}</h3>

        <p>${item.Category}</p>

        <iframe
          src="${item.Preview}">
        </iframe>

        <a
          href="${item.Preview}"
          class="btn"
          target="_blank">

          Preview

        </a>

        <a
          href="${item.Download}"
          class="btn"
          target="_blank">

          Download

        </a>

      </div>

    `;

  });

}

function goBack(){

  document
    .getElementById("homePage")
    .style.display = "block";

  document
    .getElementById("filePage")
    .style.display = "none";

}

document
.getElementById("search")
.addEventListener("input", function(){

  const keyword =
    this.value.toLowerCase();

  const filtered =
    database.filter(item =>

      item.Category === currentCategory &&

      item.Material
      .toLowerCase()
      .includes(keyword)

    );

  displayData(filtered);

});

</script>

</body>
</html>
